<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Otimização</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Calculadora de Otimização</h1>
        <p>Insira os parâmetros abaixo para calcular o ponto ótimo:</p>
        
        <div class="input-group">
            <label for="valorInput">Valor de Entrada:</label>
            <input type="number" id="valorInput" placeholder="Digite um número...">
        </div>

        <button id="calcularBtn">Calcular Otimização</button>

        <div id="resultado" class="result-box">
            <!-- O resultado aparecerá aqui -->
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
