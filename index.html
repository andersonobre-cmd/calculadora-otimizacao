
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Otimização</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="calculator-container" style="width: 360px;">
        <h1>Calculadora de Otimização</h1>
        <p>Função Quadrática: f(x) = ax² + bx + c</p>
        
        <div class="input-group">
            <label for="coefA">Coeficiente a (≠ 0):</label>
            <input type="number" id="coefA" placeholder="Ex: -1">
        </div>

        <div class="input-group">
            <label for="coefB">Coeficiente b:</label>
            <input type="number" id="coefB" placeholder="Ex: 10">
        </div>

        <div class="input-group">
            <label for="coefC">Coeficiente c:</label>
            <input type="number" id="coefC" placeholder="Ex: 0">
        </div>

        <div class="input-group">
            <label for="pontoX">Calcular f(x) para um ponto x (opcional):</label>
            <input type="number" id="pontoX" placeholder="Ex: 3">
        </div>

        <button id="calcularBtn">Calcular Otimização</button>

        <div id="resultado" class="result-box" style="text-align: left; margin-top: 15px; font-size: 0.9rem;">
            <!-- O resultado aparecerá aqui -->
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
